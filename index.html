<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落とし物管理システム</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>

    <header>
        <h1>🏫 広島高校 お帰りママ</h1>
        <p>学校で見つかった落とし物を確認できます。</p>
    </header>

    <main>

        <section class="search-area">
            <input
                type="text"
                id="searchInput"
                placeholder="落とし物を検索">

            <select id="categoryFilter">
                <option>すべて</option>
                <option>文房具</option>
                <option>財布</option>
                <option>衣類</option>
                <option>電子機器</option>
                <option>その他</option>
            </select>
        </section>

        <div class="info-bar">
            <p id="itemCount"></p>
        </div>  

        <section class="items" id="itemsContainer">

        </section>


    </main>

    <!--モーダル-->
    
    <div id="modal" class="hidden">

        <div class="modal-content">

            <button id="closeModal">✕</button>

            <img id="modalImage" class="modal-image">

            <h2 id="modalName"></h2>

            <p id="modalCategory"></p>

            <p id="modalFoundPlace"></p>

            <p id="modalStoragePlace"></p>

            <p id="modalDate"></p>

            <p id="modalDescription"></p>

        </div>

    </div>
    
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script src="js/modal.js"></script>

</body>
</html>
