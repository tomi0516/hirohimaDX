<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落とし物管理システム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏫 広島高校 落とし物システム</h1>
        <p>学校で見つかった落とし物を確認できます。</p>
    </header>

    <main>

        <section class="search-area">
            <input type="text" placeholder="落とし物を検索">

            <select>
                <option>すべて</option>
                <option>文房具</option>
                <option>財布</option>
                <option>衣類</option>
                <option>電子機器</option>
                <option>その他</option>
            </select>
        </section>
        <section class="items" id="itemsContainer">

        </section>


    </main>
    
    <script src="script.js"></script>

</body>
</html>
