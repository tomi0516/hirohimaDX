<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落とし物管理システム</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/mobile.css">

</head>


<!-- ライブ配信モーダル -->
<div id="liveModal" class="hidden">

    <div class="live-modal-content">

        <button id="closeLiveModal">✕</button>

        <h2 class="live-text">落とし物ボックス ライブ配信</h2>

        <div class="live-wrapper">

            <iframe
                src="https://www.youtube.com/embed/配信ID"
                title="落とし物ボックスライブ"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>

        </div>

        <p class="live-note">
            ※ 音声は配信されません。ボックス内部のみを撮影しています
        </p>

    </div>

</div>


<body>

    <header class="header">

        <div class="header-row">
            <h1>広島高校 お帰りママ</h1>
        </div>

        <p>学校で見つかった落とし物を確認できます</p>

        <button id="liveButton" class="live-btn">
            ライブ配信
        </button>

    </header>

    <main>

        <section class="search-area">
            <input
                type="text"
                id="searchInput"
                placeholder="落とし物を検索">

            <select id="categoryFilter">
                <option>すべて</option>
                <option>文房具</option>
                <option>財布</option>
                <option>衣類</option>
                <option>電子機器</option>
                <option>その他</option>
            </select>

            <select id="sortFilter">
                <option value="createdNew">登録が新しい順</option>
                <option value="createdOld">登録が古い順</option>
                <option value="foundNew">発見日が新しい順</option>
                <option value="foundOld">発見日が古い順</option>
            </select>

        </section>

        <div class="info-bar">
            <p id="itemCount"></p>
        </div>  

        <section class="items" id="itemsContainer">

        </section>

    </main>

    <!--モーダル-->
    
    <div id="modal" class="hidden">

        <div class="modal-content">

            <button id="closeModal">✕</button>

            <img id="modalImage" class="modal-image">

            <h2 id="modalName"></h2>

            <p id="modalCategory"></p>

            <p id="modalFoundPlace"></p>

            <p id="modalStoragePlace"></p>

            <p id="modalDate"></p>

            <p id="modalDescription"></p>

        </div>

    </div>
    
    <script type="module" src="js/script.js"></script>
    

</body>
</html>
