<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お帰りママ管理システム（先生用）</title>

    
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="../css/mobile.css">

</head>

<body>
    <header>
        <button id="logoutButton">
            ログアウト
        </button>
    </header>


<main>

    <section class="form-card">

        <h2>落とし物を登録</h2>

        <div class="form">

            <input
                id="name"
                type="text"
                placeholder="落とし物名">

            <select id="category">
                <option>文房具</option>
                <option>財布</option>
                <option>衣類</option>
                <option>電子機器</option>
                <option>その他</option>
            </select>

            <input
                id="foundPlace"
                type="text"
                placeholder="発見場所">

            <input
                id="storagePlace"
                type="text"
                placeholder="保管場所">

            <input
                id="foundDate"
                type="date">

            <textarea
                id="description"
                placeholder="特徴など"></textarea>

            <input
                id="imageFile"
                type="file"
                accept="image/*">

            <button id="saveButton">
                登録する
            </button>

        </div>

    </section>

    <section class="stats">

        <div class="stat-card">
            <h3>🔴 確認中</h3>
            <p id="pendingCount">0件</p>
        </div>

        <div class="stat-card">

            <h3>📦 保管中</h3>

            <p id="keepingCount">0件</p>

        </div>

        <div class="stat-card">

            <h3>✅ 返却済み</h3>

            <p id="returnedCount">0件</p>

        </div>

        <div class="stat-card">

            <h3>📂 カテゴリ</h3>

            <p id="categoryCount">0種類</p>

        </div>

    </section>

    <section class="list-area">

        <h2 class="list-title">
            登録済み落とし物
        </h2>

        <button id="csvButton" class="csv-btn">
            CSVファイルダウンロード
        </button>

        <div id="itemList" class="item-grid"></div>

        <h2>返却履歴</h2>

        <div id="historyList"></div>

    </section>

</main>

<script type="module" src="dashboard.js"></script>

</body>
</html>
