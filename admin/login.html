<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>先生ログイン</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-box">

        <h1>先生用ログイン</h1>

        <input
            type="email"
            id="email"
            placeholder="メールアドレス">

        <input
            type="password"
            id="password"
            placeholder="パスワード">

        <button id="loginButton">
            ログイン
        </button>

        <p id="message"></p>

    </div>

    <script type="module" src="login.js"></script>

</body>

</html>
